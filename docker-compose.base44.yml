services:
  web:
    image: oven/bun:1
    working_dir: /app
    volumes:
      - ./:/app
      # keep installed deps out of the bind mount's node_modules on the host
      - node_modules:/app/node_modules
    env_file:
      - ./.env                 # repo's committed publishable Supabase keys (public) -> process.env for SSR
      - /run/base44/app.env    # platform-managed secrets (service role key, Monime, etc.) — LAST, always wins
    environment:
      - BASE44_PUBLIC_HOST_SUFFIX=${BASE44_PUBLIC_HOST_SUFFIX}
    command: sh -c "bun install && bun run dev -- --host 0.0.0.0 --port 3000"
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  node_modules:
